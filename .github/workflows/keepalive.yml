name: Keep Render Alive

on:
  schedule:
    # 每 10 分钟自动 Ping 一次各大核心服务，彻底杜绝 Render 容器冷休眠
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping All Services
        run: |
          echo "Pinging anaiot-backend..."
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 "https://anaiot-backend.onrender.com" || true
          
          echo "Pinging anaiot-core..."
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 "https://anaiot-core.onrender.com/actuator/health" || true

          echo "Pinging mymem..."
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 "https://mymem-wlxw.onrender.com" || true

          echo "Pinging moviehub..."
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 "https://moviehub-source-server.onrender.com" || true

          echo "Keepalive ping completed successfully!"
